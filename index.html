<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nearby Explorer</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    margin:0;
    height:100vh;
    display:flex;
    flex-direction:column;
}


header{
    background:#111;
    color:white;
    padding:15px;
    font-size:22px;
    font-weight:bold;
}


.search{
    padding:15px;
    display:flex;
    gap:10px;
}


input{
    flex:1;
    padding:12px;
    border-radius:8px;
    border:1px solid #ccc;
}


button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
}


.container{
    flex:1;
    display:flex;
}


#map{
    flex:2;
}


#places{
    flex:1;
    overflow:auto;
    padding:15px;
}


.card{
    padding:15px;
    border-radius:12px;
    margin-bottom:10px;
    box-shadow:0 2px 8px #ccc;
}


.card h3{
    margin:0 0 8px;
}


</style>

</head>


<body>


<header>
📍 Nearby Explorer
</header>


<div class="search">

<input 
id="query"
placeholder="Restaurant, magasin, café..."
>

<button onclick="searchPlaces()">
Rechercher
</button>

</div>


<div class="container">

<div id="map"></div>

<div id="places">

<h2>
Résultats
</h2>

</div>

</div>



<script>


let map;

let userPosition;

let service;

let markers=[];



function initMap(){


navigator.geolocation.getCurrentPosition(

(position)=>{


userPosition={

lat:position.coords.latitude,

lng:position.coords.longitude

};



map = new google.maps.Map(
document.getElementById("map"),
{

center:userPosition,

zoom:15

});



new google.maps.Marker({

map:map,

position:userPosition,

title:"Votre position",

icon:
"https://maps.google.com/mapfiles/ms/icons/blue-dot.png"

});



service =
new google.maps.places.PlacesService(map);


},

(error)=>{


alert(
"Impossible d'obtenir votre position"
);


}

);


}




function searchPlaces(){


let keyword =
document.getElementById("query").value;


if(!keyword || !userPosition)
return;



clearMarkers();


service.nearbySearch(

{

location:userPosition,

radius:3000,

keyword:keyword

},

(results,status)=>{


if(
status !== google.maps.places.PlacesServiceStatus.OK
)
return;



displayPlaces(results);



}

);


}




function displayPlaces(results){


let container =
document.getElementById("places");


container.innerHTML =
"<h2>Résultats</h2>";



results.forEach(place=>{


let marker =
new google.maps.Marker({

map:map,

position:
place.geometry.location,

title:
place.name

});


markers.push(marker);



let card =
document.createElement("div");

card.className="card";


card.innerHTML=`

<h3>${place.name}</h3>

<p>
${place.vicinity || ""}
</p>

<p>
⭐ ${place.rating || "Pas de note"}
</p>

`;



container.appendChild(card);



});


}




function clearMarkers(){


markers.forEach(
marker=>marker.setMap(null)
);


markers=[];


}



</script>



<script async
src="https://maps.googleapis.com/maps/api/js?key=VOTRE_CLE_API&libraries=places&callback=initMap">
</script>


</body>
</html>
