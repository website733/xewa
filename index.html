<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nearby Explorer Free</title>


<link 
rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"
/>


<style>

body{
margin:0;
font-family:Arial;
height:100vh;
display:flex;
flex-direction:column;
}


header{

background:#111;
color:white;
padding:15px;
font-size:22px;
font-weight:bold;

}


.search{

padding:10px;
display:flex;
gap:10px;

}


input{

flex:1;
padding:12px;
border-radius:8px;
border:1px solid #ccc;

}


button{

background:#2563eb;
color:white;
border:none;
border-radius:8px;
padding:12px 20px;
cursor:pointer;

}


.main{

display:flex;
flex:1;

}


#map{

flex:2;

}


#results{

flex:1;
overflow:auto;
padding:15px;

}


.card{

background:white;
box-shadow:0 2px 8px #ccc;
padding:12px;
border-radius:10px;
margin-bottom:10px;

}

</style>

</head>


<body>


<header>
🌍 Nearby Explorer Free
</header>


<div class="search">

<input 
id="search"
placeholder="Restaurant, magasin, café..."
>


<button onclick="findPlaces()">
Chercher
</button>

</div>


<div class="main">

<div id="map"></div>


<div id="results">

<h2>
Lieux proches
</h2>

</div>


</div>



<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script>


let map;

let userLocation;

let markers=[];



// Initialisation carte

function start(){


navigator.geolocation.getCurrentPosition(

pos=>{


userLocation={

lat:pos.coords.latitude,

lng:pos.coords.longitude

};



map=L.map('map')
.setView(
[
userLocation.lat,
userLocation.lng
],
15
);



L.tileLayer(

'https://tile.openstreetmap.org/{z}/{x}/{y}.png',

{

maxZoom:19

}

).addTo(map);



L.marker(
[
userLocation.lat,
userLocation.lng
]
)

.addTo(map)

.bindPopup(
"📍 Vous êtes ici"
)

.openPopup();



},

()=>{

alert(
"Autorisez la localisation"
);

}


);


}




async function findPlaces(){


let query =
document.getElementById("search").value;



if(!query)
return;



let radius=3000;



let url=

`
https://overpass-api.de/api/interpreter?data=

[out:json];

(

node

["name"]
["${query}"]

(around:${radius},

${userLocation.lat},

${userLocation.lng});



way

["name"]
["${query}"]

(around:${radius},

${userLocation.lat},

${userLocation.lng});

);

out center;

`;



let response =
await fetch(url);



let data =
await response.json();



showResults(
data.elements
);



}





function showResults(places){


document.getElementById("results").innerHTML=
"<h2>Lieux trouvés</h2>";



clearMarkers();



places.forEach(place=>{


let lat =
place.lat || place.center.lat;


let lng =
place.lon || place.center.lon;



let name =
place.tags.name;



let marker =
L.marker(
[
lat,
lng
]

)

.addTo(map)

.bindPopup(
name
);



markers.push(marker);



let card =
document.createElement("div");


card.className="card";

card.innerHTML=

`

<h3>${name}</h3>

<p>
${place.tags.amenity || place.tags.shop || "Lieu"}
</p>

<button onclick="go(${lat},${lng})">
Voir sur carte
</button>

`;



document
.getElementById("results")
.appendChild(card);



});


}




function go(lat,lng){

map.setView(
[
lat,
lng
],
18
);

}



function clearMarkers(){

markers.forEach(
m=>map.removeLayer(m)
);

markers=[];

}



start();


</script>


</body>
</html>
